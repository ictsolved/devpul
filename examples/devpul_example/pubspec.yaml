name: devpul_example
description: Example Flutter app using every DevPul package.
publish_to: none
version: 1.1.0

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  app_links: ">=6.0.0 <8.0.0"
  bloc: ^9.1.0
  devpul: ^1.1.0
  devpul_dio: ^1.1.0
  devpul_flutter: ^1.1.0
  devpul_http: ^1.1.0
  dio: ^5.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ">=20.0.0 <23.0.0"
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^10.0.0
  go_router: ">=14.0.0 <19.0.0"
  path_provider: ^2.1.0
  sqflite: ^2.4.0
  sqflite_common: ">=2.4.0+2 <3.0.0"
  sqflite_common_ffi: ^2.3.0
  stream_channel: ^2.1.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  devpul_test: ^1.1.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
