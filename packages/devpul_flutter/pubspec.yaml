name: devpul_flutter
description: Flutter error hooks for DevPul. Sends FlutterError and uncaught platform errors to the DevPul browser UI.
version: 1.0.0
homepage: https://devpul.saradgajurel.com.np
documentation: https://devpul.saradgajurel.com.np/docs/flutter/
repository: https://github.com/ictsolved/devpul/tree/main/packages/devpul_flutter
issue_tracker: https://github.com/ictsolved/devpul/issues
topics: [debugging, errors, logging, flutter, devtools]

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

resolution: workspace

dependencies:
  devpul: ^1.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  devpul_test: ^1.0.0
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
