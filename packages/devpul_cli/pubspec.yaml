name: devpul_cli
description: "Command line for DevPul: serves the UI on 127.0.0.1, runs the app with it connected, adds plugins and serves the app's events to agents over MCP."
version: 1.1.1
homepage: https://devpul.saradgajurel.com.np
documentation: https://devpul.saradgajurel.com.np/docs/connecting/
repository: https://github.com/ictsolved/devpul/tree/main/packages/devpul_cli
issue_tracker: https://github.com/ictsolved/devpul/issues
topics: [debugging, network, cli, devtools]

screenshots:
  - description: A session in the DevPul UI. Requests arrive, a POST opens with its headers and bodies, then an error shows with the requests before it.
    path: screenshots/session-light.webp
  - description: The Plugins tab with plugins added by devpul add.
    path: screenshots/plugins-light.webp
  - description: The SQLite tab of the sqflite plugin, showing a table of the app's database.
    path: screenshots/sqlite-light.webp

environment:
  sdk: ^3.8.0

resolution: workspace

executables:
  devpul: devpul

dependencies:
  crypto: ^3.0.7
  dart_mcp: ^0.5.2
  # Holds the UI build.
  devpul: ^1.1.1
  path: ^1.9.0
  pub_semver: ^2.2.1
  stack_trace: ^1.12.1
  vm_service: ^15.0.0
  watcher: ^1.2.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
  yaml: ^3.1.0
