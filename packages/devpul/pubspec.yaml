name: devpul
description: Stream HTTP calls, errors and custom events from a running Dart or Flutter app to a browser UI over the Dart VM service. Debug builds only.
version: 1.1.1
homepage: https://devpul.saradgajurel.com.np
documentation: https://devpul.saradgajurel.com.np/docs/api/
repository: https://github.com/ictsolved/devpul/tree/main/packages/devpul
issue_tracker: https://github.com/ictsolved/devpul/issues
topics: [debugging, network, logging, http, devtools]

screenshots:
  - description: A session in the DevPul UI. Requests arrive, a POST opens with its headers and bodies, then an error shows with the requests before it.
    path: screenshots/session-light.webp
  - description: The HTTP tab with a request's headers and bodies.
    path: screenshots/http-light.webp
  - description: The Errors tab with a stack trace and the requests made before the error.
    path: screenshots/errors-light.webp

environment:
  sdk: ^3.8.0

resolution: workspace

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
  vm_service: ^15.0.0
