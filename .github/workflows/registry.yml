name: Registry

on:
  push:
    branches: [main]
    paths:
      [
        registry/**,
        plugins/**,
        tool/build_registry.dart,
        tool/build-site.mjs,
        apps/docs/src/plugins.ts,
        .github/workflows/registry.yml,
      ]
  pull_request:
    paths:
      [
        registry/**,
        plugins/**,
        tool/build_registry.dart,
        tool/build-site.mjs,
        apps/docs/src/plugins.ts,
        .github/workflows/registry.yml,
      ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # First-party plugins are listed from their <id>-v<version> tags.
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: flutter pub get
      - run: npm ci
      - run: npm run build:registry
      - run: DEVPUL_REGISTRY=build/registry npm run build:site
