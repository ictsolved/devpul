name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages examples
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: packages/devpul
      - run: dart test -p chrome
        working-directory: packages/devpul
      - run: dart test
        working-directory: packages/devpul_dio
      - run: flutter test
        working-directory: packages/devpul_flutter

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
