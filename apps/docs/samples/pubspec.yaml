  devpul_http: ^1.0.0
  dio: ^5.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_riverpod: ^3.0.0
  http: ^1.2.0
  logging: ^1.2.0
